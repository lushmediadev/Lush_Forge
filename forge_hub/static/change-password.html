<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0d10">
  <title>Đổi mật khẩu · Lush Forge</title>
  <link rel="icon" type="image/svg+xml" href="/hub/assets/lush-logo-red.svg">
  <link rel="stylesheet" href="/hub/assets/style.css?v=2">
  <script src="/hub/assets/change-password.js" defer></script>
</head>
<body class="login-page">
  <div class="login-backdrop" aria-hidden="true"></div>
  <main class="login-shell">
    <header class="login-header">
      <div class="brand"><img class="brand-logo" src="/hub/assets/lush-logo-red.svg" alt="Logo Lush Media"><span>Lush Media</span></div>
      <span class="workspace-name">Forge Studio</span>
    </header>
    <div class="login-grid">
      <section class="login-copy" aria-label="Giới thiệu Lush Forge">
        <p class="login-kicker">Không gian tạo ảnh của Lush Media</p>
        <h1>Từ ý tưởng<br>đến hình ảnh.</h1>
        <p>Đổi mật khẩu để tiếp tục công việc trên Forge.</p>
      </section>
      <section class="login-panel" aria-labelledby="change-title">
        <div class="login-panel-heading">
          <img class="panel-logo" src="/hub/assets/lush-logo-red.svg" alt="">
          <div><span class="panel-brand">Lush Media</span><span class="panel-product">Forge Studio</span></div>
        </div>
        <h2 id="change-title">Đổi mật khẩu tạm</h2>
        <p class="intro">Đặt mật khẩu mới để tiếp tục vào Forge.</p>
        <form id="change-form">
          <label for="new-password">Mật khẩu mới</label>
          <input id="new-password" name="new-password" type="password" minlength="1" required autocomplete="new-password">
          <label for="confirm-password">Nhập lại mật khẩu</label>
          <input id="confirm-password" name="confirm-password" type="password" minlength="1" required autocomplete="new-password">
          <p id="change-error" class="form-error" role="alert" hidden></p>
          <button id="change-submit" class="button button-primary login-submit" type="submit">Lưu mật khẩu</button>
        </form>
      </section>
    </div>
    <footer class="login-footer"><span>Lush Media · Forge Studio</span><span>Dành cho đội ngũ nội bộ</span></footer>
  </main>
</body>
</html>
